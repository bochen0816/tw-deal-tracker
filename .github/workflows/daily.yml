name: daily

on:
  schedule:
    - cron: "17 20 * * *"   # UTC 20:17 = 台灣時間 04:17，每天一次
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - name: 自動測試
        run: python -m pytest -q tests
      - name: 抓取價格
        run: python src/scraper.py data/snapshot.json
      - name: 更新價格歷史
        run: python src/history.py data/snapshot.json
      - name: 產生網站
        run: python src/build_site.py
      - name: 保存資料到專案庫
        run: |
          git config user.name "tw-deal-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/history.csv data/last_run.json
          git diff --cached --quiet || git commit -m "資料更新 $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
