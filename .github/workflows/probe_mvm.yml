name: probe-mvm

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/probe_mvm.py"
      - ".github/workflows/probe_mvm.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: python tools/probe_mvm.py
