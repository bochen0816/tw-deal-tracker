name: probe-mvm

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/dump_mvm_words.py"
      - ".github/workflows/probe_mvm.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: |
          mkdir -p tests/fixtures
          python tools/dump_mvm_words.py /mediapermalink/fy27p3-mvm2-pdf tests/fixtures/mvm_fy27p3_mvm2_words.json
      - run: |
          git config user.name "tw-deal-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures
          git diff --cached --quiet || git commit -m "測試資料：會員護照 PDF 文字座標"
          git push
