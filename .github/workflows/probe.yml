name: probe

on:
  workflow_dispatch:
  # push: 已停用（探測完成）

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe_out
          path: probe_out/
          retention-days: 3
